[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fig-quant"
version = "0.1.0"
description = "FIG Pod Quant Research Pipeline: bi-temporal PIT data, CANN/GBM pricing, GARCH-EVT risk, Bayesian capital allocation."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "FIG Quant Pod"}]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "typer>=0.13",
  "duckdb>=1.1",
  "pyarrow>=17.0",
  "polars>=1.12",
  "numpy>=2.1",
  "taipy>=4.0",
  "torch>=2.5",
  "xgboost>=2.1",
  "scipy>=1.14",
  "pandas>=2.2",
  "uvicorn>=0.32",
  "litellm>=1.52",
  "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
notebook = ["ipython>=9.16.1", "ipykernel>=7.3.0"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "hypothesis>=6.115", "ruff>=0.7", "mypy>=1.13"]
plot = ["plotly>=5.24", "kaleido>=0.2.1"]

[project.scripts]
fig-quant = "fig_quant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fig_quant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fig_quant --cov-report=xml --cov-report=term-missing"

[tool.coverage.run]
source = ["src/fig_quant"]
